    <!-- Chosen Palette: Calm Harmony -->
    <!-- Application Structure Plan: The application is designed as an interactive dashboard. The core structure uses a sidebar for quick navigation and a main content area with collapsible accordion sections for each DSA topic. This design was chosen over a flat list to manage cognitive load; users can focus on one topic at a time while still getting a high-level overview. Key interactions include checking off sub-topics to track progress, which dynamically updates progress bars and a main summary chart. A search bar allows for instant filtering. This structure provides a clear, hierarchical, and motivating user flow, transforming a static list into a dynamic learning tool. -->
    <!-- Visualization & Content Choices: 
        - Report Info: Overall Progress. Goal: Motivate. Viz: Donut Chart (Chart.js). Interaction: Updates on checkbox click. Justification: Provides an immediate, high-level summary of the user's entire journey.
        - Report Info: Per-Topic Progress. Goal: Granular Feedback. Viz: HTML/CSS Progress Bar. Interaction: Updates on checkbox click. Justification: Shows progress within a specific category, encouraging completion of sections.
        - Report Info: DSA Topics & Patterns. Goal: Organize & Inform. Viz: Accordion List (HTML/Tailwind/JS). Interaction: Expand/collapse to show/hide details. Justification: Prevents information overload and allows focused study.
        - Report Info: Learning Resources. Goal: Actionable Learning. Viz: Curated Links. Interaction: Click to open new tab. Justification: Connects theory with practice by providing direct access to top-tier learning materials.
        - Library/Method: Chart.js for canvas-based charting. All other elements are structured HTML with Tailwind and manipulated with vanilla JS.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-primary: #0891b2;
            --accent-primary-light: #cffafe;
            --border-color: #e2e8f0;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main);
            color: var(--text-primary);
        }
        .progress-bar-fill { 
            transition: width 0.5s ease-in-out; 
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1);
        }
        .accordion-content.open {
            max-height: 2000px; /* Adjust as needed */
            transition: max-height 1s ease-in-out;
        }
        .sticky-sidebar {
            position: sticky;
            top: 1.5rem; /* 64px */
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: var(--bg-card);
            margin: auto;
            padding: 24px;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            position: relative;
        }
        .close-button {
            color: var(--text-secondary);
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0891b2;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        pre {
            background-color: #f1f5f9;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
    </style>
</head>

                    </div>
                </div>
            </aside>

            <section id="topics-container" class="flex-1">

            </div>

                    { name: "Palindrome Partitioning", completed: false, resources: { watch: "https://www.youtube.com/watch?v=3I3l-x93kOY", read: "https://www.geeksforgeeks.org/palindrome-partitioning-dp-17/", practice: "https://leetcode.com/problems/palindrome-partitioning/" } }
                ]
            },
            {
                topic: "Dynamic Programming",
                icon: "🧮",
                patterns: [
                    { name: "Intro: Memoization vs Tabulation", completed: false, resources: { watch: "https://www.youtube.com/watch?v=tyB0ztf0DNY", read: "https://www.geeksforgeeks.org/tabulation-vs-memoization/", practice: "https://leetcode.com/problems/fibonacci-number/" } },
                    { name: "1D DP (Climbing Stairs, House Robber)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=pchOMyP4I0U", read: "https://leetcode.com/explore/learn/card/dynamic-programming/631/pro-tip-patterns-for-dp-problems/4090/", practice: "https://leetcode.com/problems/climbing-stairs/" } },
                    { name: "2D DP / Grid DP (Unique Paths)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=GO5QHC_B_cA", read: "https://www.geeksforgeeks.org/unique-paths-in-a-grid-with-obstacles/", practice: "https://leetcode.com/problems/unique-paths/" } },
                    { name: "Knapsack (0/1, Unbounded)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=GqOmJHQZivw", read: "https://www.geeksforgeeks.org/0-1-knapsack-problem-dp-10/", practice: "https://leetcode.com/problems/coin-change/" } },
                    { name: "Longest Common Subsequence (LCS)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=LAKW_2wgh9k", read: "https://www.geeksforgeeks.org/longest-common-subsequence-dp-4/", practice: "https://leetcode.com/problems/longest-common-subsequence/" } },
                    { name: "Longest Increasing Subsequence (LIS)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=fV-TF41Zmv0", read: "https://www.geeksforgeeks.org/longest-increasing-subsequence-dp-3/", practice: "https://leetcode.com/problems/longest-increasing-subsequence/" } },
                    { name: "DP on Trees", completed: false, resources: { watch: "https://www.youtube.com/watch?v=Osz-Vwer6rw", read: "https://codeforces.com/blog/entry/20935", practice: "https://leetcode.com/problems/binary-tree-maximum-path-sum/" } },
                    { name: "DP with Bitmasking", completed: false, resources: { watch: "https://www.youtube.com/watch?v=685x-rzOIlY", read: "https://www.geeksforgeeks.org/bitmasking-and-dynamic-programming/", practice: "https://leetcode.com/problems/partition-to-k-equal-sum-subsets/" } }
                ]
            },
            {
                topic: "Advanced Data Structures",
                icon: "🌟",
                patterns: [
                    { name: "Segment Tree", completed: false, resources: { watch: "https://www.youtube.com/watch?v=2bSS8rtFym4", read: "https://cp-algorithms.com/data_structures/segment_tree.html", practice: "https://leetcode.com/problems/range-sum-query-mutable/" } },
                    { name: "Fenwick Tree (Binary Indexed Tree)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=CWDQJGaN1gY", read: "https://cp-algorithms.com/data_structures/fenwick.html", practice: "https://leetcode.com/problems/range-sum-query-mutable/" } }
                ]
            },
            {
                topic: "Greedy Algorithms",
                icon: "💥",
                patterns: [
                    { name: "Interval Scheduling (Activity Selection)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=F-17JMXJ-gA", read: "https://www.geeksforgeeks.org/activity-selection-problem-greedy-algo-1/", practice: "https://leetcode.com/problems/non-overlapping-intervals/" } },
                    { name: "Fractional Knapsack", completed: false, resources: { watch: "https://www.youtube.com/watch?v=F_DDzY-C2qc", read: "https://www.geeksforgeeks.org/fractional-knapsack-problem/", practice: "https://www.codingninjas.com/studio/problems/fractional-knapsack_975286" } },
                    { name: "Huffman Coding", completed: false, resources: { watch: "https://www.youtube.com/watch?v=0kNXhUcr3qQ", read: "https://www.geeksforgeeks.org/huffman-coding-greedy-algo-3/", practice: "https://www.codingninjas.com/studio/problems/huffman-encoding_1263626" } },
                    { name: "Jump Game", completed: false, resources: { watch: "https://www.youtube.com/watch?v=yan_IqztmYg", read: "https://leetcode.com/problems/jump-game/solutions/128393/official-solution/", practice: "https://leetcode.com/problems/jump-game/" } }
                ]
            },
            {
                topic: "Bit Manipulation",
                icon: "🧊",
                patterns: [
                    { name: "Bitwise Operators (XOR, AND, OR)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=mesu75PTj9g", read: "https://www.geeksforgeeks.org/bitwise-operators-in-c-cpp/", practice: "https://leetcode.com/problems/single-number/" } },
                    { name: "Bit Masking", completed: false, resources: { watch: "https://www.youtube.com/watch?v=NLpSGS-kbyY", read: "https://www.geeksforgeeks.org/bitmasking-and-dynamic-programming/", practice: "https://leetcode.com/problems/number-of-1-bits/" } },
                    { name: "Count Set Bits (Brian Kernighan's Algo)", completed: false, resources: { watch: "https://www.youtube.com/watch?v=I475vBg_I-w", read: "https://www.geeksforgeeks.org/count-set-bits-in-an-integer/", practice: "https://leetcode.com/problems/counting-bits/" } },
                ]
            },
            {
                topic: "Math for DSA",
                icon: "🧾",
                patterns: [
                    { name: "Prime Numbers / Sieve of Eratosthenes", completed: false, resources: { watch: "https://www.youtube.com/watch?v=jxi0_q4_q8A", read: "https://www.geeksforgeeks.org/sieve-of-eratosthenes/", practice: "https://leetcode.com/problems/count-primes/" } },
                    { name: "GCD / LCM / Euclidean Algorithm", completed: false, resources: { watch: "https://www.youtube.com/watch?v=1p_e4V2o25s", read: "https://www.geeksforgeeks.org/euclidean-algorithms-basic-and-extended/", practice: "https://leetcode.com/problems/find-greatest-common-divisor-of-array/" } },
                    { name: "Modular Arithmetic & Fast Exponentiation", completed: false, resources: { watch: "https://www.youtube.com/watch?v=nO7_qu2kd1U", read: "https://www.geeksforgeeks.org/modular-exponentiation-power-in-modular-arithmetic/", practice: "https://leetcode.com/problems/powx-n/" } },
                    { name: "Combinations / nCr", completed: false, resources: { watch: "https://www.youtube.com/watch?v=g_h5ff0tIZs", read: "https://www.geeksforgeeks.org/compute-ncr-p-set-1-introduction-and-dynamic-programming-solution/", practice: "https://leetcode.com/problems/pascals-triangle/" } }
                ]
            },
        ];


        let progressChart;
        const app = {
            init() {
                this.renderTopics();
                this.renderNav();
                this.updateProgress();
                this.addEventListeners();
            },
            renderTopics() {
                const container = document.getElementById('topics-container');
                container.innerHTML = dsaData.map((topic, topicIndex) => `
                    <div class="topic-card bg-card shadow-md rounded-xl mb-4" data-topic-name="${topic.topic.toLowerCase()}">
                        <button class="accordion-toggle w-full flex items-center justify-between p-5 text-left font-semibold text-lg hover:bg-slate-50 rounded-t-xl">
                            <span class="flex items-center">
                                <span class="text-2xl mr-4">${topic.icon}</span>
                                <span>${topic.topic}</span>
                            </span>
                            <button class="ml-4 px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-medium hover:bg-purple-200 transition" onclick="app.generateInterviewQuestions('${topic.topic}')">✨ Generate Questions</button>
                            <span class="accordion-arrow transform transition-transform duration-300">▼</span>
                        </button>
                        <div class="p-4 border-t border-slate-200">
                            <div class="w-full bg-slate-200 rounded-full h-2.5 mb-4">
                                <div id="progress-bar-${topicIndex}" class="bg-cyan-600 h-2.5 rounded-full progress-bar-fill" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="accordion-content">
                            <ul class="divide-y divide-border-color">
                                ${topic.patterns.map((pattern, patternIndex) => `
                                    <li class="p-5 hover:bg-slate-50 flex items-start justify-between gap-4">
                                        <div class="flex items-start">
                                            <input type="checkbox" id="cb-${topicIndex}-${patternIndex}" class="mt-1 h-5 w-5 rounded border-gray-300 text-cyan-600 focus:ring-cyan-500" ${pattern.completed ? 'checked' : ''} data-topic="${topicIndex}" data-pattern="${patternIndex}">
                                            <label for="cb-${topicIndex}-${patternIndex}" class="ml-3 text-base text-slate-700">${pattern.name}</label>
                                        </div>
                                        <div class="flex-shrink-0 flex items-center gap-2">
                                            <a href="${pattern.resources.watch}" target="_blank" class="text-xs font-medium px-2 py-1 bg-red-100 text-red-700 rounded-full hover:bg-red-200 transition">Watch 📺</a>
                                            <a href="${pattern.resources.read}" target="_blank" class="text-xs font-medium px-2 py-1 bg-blue-100 text-blue-700 rounded-full hover:bg-blue-200 transition">Read 📖</a>
                                            <a href="${pattern.resources.practice}" target="_blank" class="text-xs font-medium px-2 py-1 bg-green-100 text-green-700 rounded-full hover:bg-green-200 transition">Practice 💻</a>
                                            <button class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-medium hover:bg-yellow-200 transition" onclick="app.generateExplanation('${pattern.name}')">✨ Explain</button>
                                            <button class="px-3 py-1 bg-cyan-100 text-cyan-700 rounded-full text-xs font-medium hover:bg-cyan-200 transition" onclick="app.analyzeComplexity('${pattern.name}')">✨ Analyze Complexity</button>
                                            <button class="px-3 py-1 bg-slate-100 text-slate-700 rounded-full text-xs font-medium hover:bg-slate-200 transition" onclick="app.generateCodeSnippet('${pattern.name}', 'Python')">✨ Python Code</button>
                                            <button class="px-3 py-1 bg-slate-100 text-slate-700 rounded-full text-xs font-medium hover:bg-slate-200 transition" onclick="app.generateCodeSnippet('${pattern.name}', 'JavaScript')">✨ JS Code</button>
                                        </div>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `).join('');
            },
            renderNav() {
                const navContainer = document.getElementById('nav-links');
                navContainer.innerHTML = dsaData.map((topic, index) => `
                    <a href="#" data-nav-index="${index}" class="block px-4 py-2 text-slate-600 hover:bg-cyan-50 hover:text-cyan-700 rounded-md transition-colors">${topic.icon} ${topic.topic}</a>
                `).join('');
            },
            updateProgress() {
                let totalPatterns = 0;
                let completedPatterns = 0;

                dsaData.forEach((topic, topicIndex) => {
                    const completed = topic.patterns.filter(p => p.completed).length;
                    const total = topic.patterns.length;
                    totalPatterns += total;
                    completedPatterns += completed;
                    const percentage = total > 0 ? (completed / total) * 100 : 0;
                    const progressBar = document.getElementById(`progress-bar-${topicIndex}`);
                    if(progressBar) progressBar.style.width = `${percentage}%`;
                });

                const overallPercentage = totalPatterns > 0 ? (completedPatterns / totalPatterns) * 100 : 0;
                this.renderChart(overallPercentage, completedPatterns, totalPatterns);
            },
            renderChart(percentage, completedCount, totalCount) {
                const ctx = document.getElementById('progressChart').getContext('2d');
                const summaryEl = document.getElementById('progress-summary');
                summaryEl.textContent = `${completedCount} / ${totalCount} Patterns Mastered`;
                
                if (progressChart) {
                    progressChart.data.datasets[0].data = [percentage, 100 - percentage];
                    progressChart.update();
                } else {
                    progressChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            datasets: [{
                                data: [percentage, 100 - percentage],
                                backgroundColor: [
                                    '#0891b2',
                                    '#e2e8f0'
                                ],
                                borderWidth: 0,
                                borderRadius: 5,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '75%',
                            plugins: {
                                legend: { display: false },
                                tooltip: { enabled: false }
                            },
                        }
                    });
                }
            },
            addEventListeners() {
                const container = document.getElementById('topics-container');
                container.addEventListener('click', (e) => {
                    const toggle = e.target.closest('.accordion-toggle');
                    if (toggle) {
                        const content = toggle.parentElement.querySelector('.accordion-content');
                        const arrow = toggle.querySelector('.accordion-arrow');

                        // Added null checks to prevent TypeError
                        if (content) {
                            content.classList.toggle('open');
                        }
                        if (arrow) {
                            arrow.classList.toggle('rotate-180');
                        }
                    }
                });

                const searchBar = document.getElementById('search-bar');
                searchBar.addEventListener('keyup', (e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    const cards = document.querySelectorAll('.topic-card');
                    cards.forEach(card => {
                        const topicName = card.dataset.topicName;
                        const patterns = Array.from(card.querySelectorAll('label')).map(l => l.textContent.toLowerCase()).join(' ');
                        if (topicName.includes(searchTerm) || patterns.includes(searchTerm)) {
                            card.style.display = 'block';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
                
                const navLinks = document.getElementById('nav-links');
                navLinks.addEventListener('click', e => {
                    e.preventDefault();
                    const navLink = e.target.closest('a');
                    if (navLink) {
                        const index = navLink.dataset.navIndex;
                        const targetCard = document.querySelectorAll('.topic-card')[index];
                        if (targetCard) {
                            targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    }
                });

                // Modal event listeners
                document.getElementById('closeModalBtn').addEventListener('click', () => {
                    document.getElementById('llmModal').style.display = 'none';
                });
                window.addEventListener('click', (event) => {
                    if (event.target == document.getElementById('llmModal')) {
                        document.getElementById('llmModal').style.display = 'none';
                    }
                });
            },

            async showModal(title, contentPromise) {
                const modal = document.getElementById('llmModal');
                const modalTitle = document.getElementById('modalTitle');
                const modalContent = document.getElementById('modalContent');

                modalTitle.textContent = title;
                modalContent.innerHTML = '<div class="loading-spinner"></div>'; // Show loading spinner
                modal.style.display = 'flex'; // Use flex to center content

                try {
                    const content = await contentPromise;
                    if (content.startsWith('```')) {
                        modalContent.innerHTML = `<pre><code>${content.replace(/```[a-z]*\n|```/g, '').trim()}</code></pre>`;
                    } else {
                        modalContent.innerHTML = `<p>${content.replace(/\n/g, '<br>')}</p>`;
                    }
                } catch (error) {
                    modalContent.innerHTML = `<p class="text-red-500">Error: ${error.message}. Please try again.</p>`;
                    console.error("LLM API call failed:", error);
                }
            },

            async callGeminiAPI(prompt) {
                let chatHistory = [];
                chatHistory.push({ role: "user", parts: [{ text: prompt }] });
                const payload = { contents: chatHistory };
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    return result.candidates[0].content.parts[0].text;
                } else {
                    throw new Error("No content received from API.");
                }
            },

            generateExplanation(patternName) {
                const prompt = `Explain the Data Structures and Algorithms pattern: ${patternName} concisely, as if explaining to a beginner. Keep it under 100 words.`;
                this.showModal(`Explanation for ${patternName}`, this.callGeminiAPI(prompt));
            },

            generateInterviewQuestions(topicName) {
                const prompt = `Generate 3 common coding interview questions related to the Data Structures and Algorithms topic: ${topicName}. Provide only the question statements, without solutions or explanations. Format each question with a leading number and a newline.`;
                this.showModal(`Interview Questions for ${topicName}`, this.callGeminiAPI(prompt));
            },

            analyzeComplexity(patternName) {
                const prompt = `Analyze the typical time and space complexity for the DSA pattern: ${patternName}. Provide the complexity in big-O notation, followed by a brief, single-sentence explanation for each.`;
                this.showModal(`Complexity Analysis for ${patternName}`, this.callGeminiAPI(prompt));
            },

            generateCodeSnippet(patternName, language) {
                const prompt = `Provide a simple, runnable, and well-commented ${language} code snippet for the Data Structures and Algorithms pattern: ${patternName}. Do not include explanations outside the comments. The entire response should be a single code block.`;
                this.showModal(`${language} Code for ${patternName}`, this.callGeminiAPI(prompt));
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
